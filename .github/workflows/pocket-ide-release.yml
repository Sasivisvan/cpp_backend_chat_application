name: Pocket IDE APK release

# Every push that touches the app builds a new APK and publishes it as the
# "latest" GitHub release. The Android app checks that release on launch and
# offers a one-tap update; the download link below always points to the newest:
#   https://github.com/<owner>/<repo>/releases/latest/download/pocket-ide.apk
on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["mobile-ide/**", ".github/workflows/pocket-ide-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-ide-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode must grow with every release so Android accepts the update.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Build web client (sanity check)
        working-directory: mobile-ide
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build APK
        working-directory: mobile-ide/android
        env:
          BUILD_TOOLS: 35.0.0
          # Optional: set these repo secrets to sign with your own key.
          KEYSTORE_B64: ${{ secrets.POCKET_IDE_KEYSTORE_B64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.POCKET_IDE_KEYSTORE_PASS }}
          KEY_ALIAS_SECRET: ${{ secrets.POCKET_IDE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE="$RUNNER_TEMP/release.jks" KEYSTORE_PASS="$KEYSTORE_PASS_SECRET" KEY_ALIAS="$KEY_ALIAS_SECRET"
          fi
          ./build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Pocket IDE ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: mobile-ide/android/build/pocket-ide.apk
          body: |
            **Download:** `pocket-ide.apk` below. If you already have the app, it will offer this update on next launch.

            Branch `${{ github.ref_name }}` · commit ${{ github.sha }}

            ${{ github.event.head_commit.message }}
